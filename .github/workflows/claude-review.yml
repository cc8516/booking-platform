name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'HotelMan_HotelAdmin/**'
      - 'hotel-booking-ui/src/**'
      - '.github/workflows/**'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for bugs, security issues, and missing error handling.
            The repo has a .NET Lambda backend (HotelMan_HotelAdmin) and a React/TypeScript UI (hotel-booking-ui).
            Flag anything that looks like a committed secret or credential.
            Comment inline on specific lines and post a short summary.
